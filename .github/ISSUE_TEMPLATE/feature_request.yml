name: 🚀 Feature Request
description: Suggest a new part, tool or improvement for Track Maker.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a feature! Please check the
        [CHANGELOG](https://github.com/edudevteam/track-maker/blob/main/CHANGELOG.md)
        first — it may already exist. All dimensions in Track Maker are millimetres.
  - type: dropdown
    id: area
    attributes:
      label: "Area"
      description: "Which part of Track Maker does this touch?"
      options:
        - Track pieces (straights, curves, transitions, junctions)
        - Connector clips
        - Export (3MF / STL)
        - Simulator / vehicles
        - Editor and controls
        - Settings ▸ Dimensions
        - Saving and loading projects
        - Other
    validations:
      required: true
  - type: textarea
    id: problem-description
    attributes:
      label: "Is your feature request related to a problem?"
      description: "A clear and concise description of what the problem is. Ex. I'm always frustrated when..."
      placeholder: "Describe the friction point or gap in functionality..."
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: "Describe the solution you'd like"
      description: "A clear and concise description of what you want to happen. Give sizes in millimetres."
      placeholder: "e.g. a 45° curve at 150mm radius..."
    validations:
      required: true
  - type: textarea
    id: alternatives-considered
    attributes:
      label: "Describe alternatives you've considered"
      description: "A clear and concise description of any alternative solutions or features you've considered."
  - type: dropdown
    id: printed
    attributes:
      label: "Have you printed the track?"
      options:
        - "No"
        - Yes, and it printed fine
        - Yes, and I hit a problem (please describe it above)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "Version"
      description: "The `app` value in a saved `.track.json` project file, or leave blank if you used the live site today."
      placeholder: "e.g. 1.4.2"
  - type: textarea
    id: additional-context
    attributes:
      label: "Additional context"
      description: "Add any other context, screenshots, mockups, or a `.track.json` project file about the feature request here."
  - type: checkboxes
    id: code-of-conduct
    attributes:
      label: "Code of Conduct"
      description: "By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/edudevteam/track-maker/blob/main/CODE_OF_CONDUCT.md)."
      options:
        - label: "I agree to follow this project's Code of Conduct"
          required: true
